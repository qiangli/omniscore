name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go test + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./...
      - run: go test ./...
      - run: gofmt -l . | tee /tmp/gofmt.out
      - run: test ! -s /tmp/gofmt.out
  frontend:
    name: Frontend build + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
  release-build:
    name: Cross-compile (smoke)
    runs-on: ubuntu-latest
    needs: [go, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: frontend
        run: npm ci && npm run build
      - run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: omniscore-binaries
          path: bin/omniscore-*
